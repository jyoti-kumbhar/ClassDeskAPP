name: Android Release Build & GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Automated Test Suites
        run: npm test

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: |
          eas build --platform android --profile preview --non-interactive --local --output=./ClassDesk.apk
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag }}
          name: ClassDesk Release ${{ github.ref_name || github.event.inputs.release_tag }}
          body: |
            ## ClassDesk Android Release
            
            ### What's in this release:
            - Production Android standalone APK (`ClassDesk.apk`)
            - Supabase Authentication & PostgreSQL Database integration
            - Secure Row Level Security & File Upload System
            - Cross-platform attendance, assignments, notices, resources, and anti-cheat MCQ exams
            
            ### Installation Instructions:
            1. Download `ClassDesk.apk` on your Android device.
            2. Open the APK file and allow installation from unknown sources if prompted.
            3. Launch ClassDesk and log in with your credentials.
          files: |
            ./ClassDesk.apk
          draft: false
          prerelease: false
